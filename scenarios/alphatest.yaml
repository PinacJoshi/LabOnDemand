scenario: "Alpha Test Range"
difficulty: "1"
description: "A functional validation range to test dynamic image provisioning, network multi-homing, and modifier boundaries."

# 1. Test Network Creation & Management
networks:
  - name: dmz_network
  - name: internal_app_network

# 2. Test Supported Image Logic (Needs 'soc-lab/defender-base' in the name)
defender_workspace:
  name: analyst-desktop
  base_image: pinacjoshi/labod-defender-base
  networks: 
    - internal_app_network
  exposed_port: 8080
  build_modifiers:
    install_packages: 
      - nmap
      - tcpdump
      - nano
    raw_instructions:
      - "ENV LAB_VALIDATION=True"

# 3. Test Generic Image Logic & Multi-Homing (Sliced Array logic)
nodes:
  - name: dmz-web-server
    base_image: alpine:latest
    networks: 
      - dmz_network
      - internal_app_network
    build_modifiers:
      - "RUN apk update && apk add --no-cache nginx"
      - "EXPOSE 80"
      - "CMD [\"nginx\", \"-g\", \"daemon off;\"]"

# 4. Test Adversary Execution Loops
attacker_node:
  name: external-threat
  base_image: alpine:latest
  networks: 
    - dmz_network
  build_modifiers:
    - "RUN apk update && apk add --no-cache curl htop"
  exec_command: "echo 'Attacker Node Active'; while true; do sleep 30; done"